name = "tpl-passport-auth"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "auth.librarypassport.ca"
custom_domain = true

[vars]
BETTER_AUTH_URL = "https://auth.librarypassport.ca"

# Secrets — set via `wrangler secret put <NAME>`:
#   BETTER_AUTH_SECRET
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET

