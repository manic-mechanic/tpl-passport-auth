name = "tpl-passport-auth"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "auth.librarypassport.ca"
custom_domain = true

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "tpl-passport-photos"

# Per-user photo upload rate limit (src/uploadLimits.ts). period must be 10
# or 60 seconds; namespace_id only has to be unique within the account.
[[ratelimits]]
name = "PHOTO_UPLOAD_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Workers Logs: keeps console output (including the onError log) so failures
# can be looked up in the Cloudflare dashboard.
[observability]
enabled = true

[vars]
# Sentry project for the auth server's errors (tagged service: auth). The
# DSN is a public key, not a secret.
SENTRY_DSN = "https://acb701f67ae8afd5590c477e83723d82@o4510749186588672.ingest.us.sentry.io/4511176097333248"
BETTER_AUTH_URL = "https://auth.librarypassport.ca"
R2_BUCKET_NAME = "tpl-passport-photos"
# Set R2_ACCOUNT_ID to your Cloudflare account ID (found in dashboard sidebar)
# Set R2_PUBLIC_URL to the public bucket URL after enabling public access:
#   - Default: https://pub-<hash>.r2.dev  (from R2 bucket settings → Public Access)
#   - Custom domain: https://photos.librarypassport.ca

# Secrets — set via `wrangler secret put <NAME>`:
#   BETTER_AUTH_SECRET
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   R2_ACCOUNT_ID         — your Cloudflare account ID
#   R2_ACCESS_KEY_ID      — R2 API token access key ID
#   R2_SECRET_ACCESS_KEY  — R2 API token secret access key
#   R2_PUBLIC_URL         — public base URL of the bucket (no trailing slash)

