# Weekly dependency update PRs. Minor and patch updates are grouped into one
# PR per ecosystem; majors come one at a time. Security updates are separate
# and immediate (enable "Dependabot security updates" in repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      # @sentry/hono requires the exact same @sentry/cloudflare version, so
      # they have to move together, majors included.
      sentry:
        patterns: ["@sentry/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types should match the Node version the Worker's tooling runs on
      # (22 in CI); bump this by hand when that changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (e.g. 7, the rewritten compiler) should move with
      # the app repo, which needs vue-tsc and Nuxt support: done by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Toronto
    groups:
      actions:
        patterns: ["*"]
