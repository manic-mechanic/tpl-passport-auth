name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets you re-run a deploy of main from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Bundles the Worker without deploying, to catch build errors.
      - name: Build Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

  # Deploys main to Cloudflare once validate passes. Needs two repository
  # secrets: CLOUDFLARE_API_TOKEN (an API token from the "Edit Cloudflare
  # Workers" template) and CLOUDFLARE_ACCOUNT_ID. Until they're set, this job
  # skips the deploy with a warning instead of failing.
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # One deploy at a time, in order; never cancel one halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Check the deployed Worker responds
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://auth.librarypassport.ca/ | grep -q "tpl-passport-auth ok"; then exit 0; fi
            sleep 5
          done
          echo "::error::https://auth.librarypassport.ca/ did not respond after deploy."
          exit 1
